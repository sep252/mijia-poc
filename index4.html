<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>GATE-TEST</title></head>
<body style="background:#000;color:#0f0;font:24px/1.8 monospace;padding:16px;word-break:break-all">
<div id=o>GATE TEST...</div>
<script>
var el = document.getElementById('o');
function log(s){ el.textContent += '\n' + s; }
log('HOST=' + location.host);
log('nezhaJSBridge=' + typeof window.nezhaJSBridge);
log('AndroidClipboard=' + typeof window.AndroidClipboard);
try {
  // 对照：白名单域内，桥若存在则为 object 且可枚举 postMessage
  if (window.nezhaJSBridge) log('postMessage=' + typeof window.nezhaJSBridge.postMessage);
} catch(e) { log('ERR ' + e.message); }
log('DONE');
</script></body></html>
