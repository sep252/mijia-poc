<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>BridgeProbe</title></head>
<body style="background:#000;color:#0f0;font:13px monospace;padding:10px;word-break:break-all">
<div id="out">probing...</div>
<script>
var out=document.getElementById('out');
var L=[];
function p(s){L.push(s);}
p('URL: '+location.href);
p('');
var names=['vivopay','vivoaccount','AppWebClient','pointjsbridge','WeiwoJSBridge'];
names.forEach(function(n){
  var o=window[n];
  if(!o){p(n+': ABSENT');return;}
  var ms=[];
  try{
    ms=Object.getOwnPropertyNames(o);
    try{ms=ms.concat(Object.getOwnPropertyNames(Object.getPrototypeOf(o)));}catch(e){}
  }catch(e){p(n+': enum-fail');return;}
  p(n+': '+ms.join(','));
});
p('');
// try signKey on the first available bridge
var b=window['vivopay']||window['vivoaccount']||window['AppWebClient'];
if(b){
  try{
    var r=b.signKey(['probe1','probe2']);
    p('signKey() -> '+String(r).substring(0,120));
  }catch(e){p('signKey() EXC: '+e);}
  try{
    var c=[];
    for(var k in b){c.push(k);}
    p('for-in keys: '+c.join(','));
  }catch(e){}
}else{
  p('NO BRIDGE OBJECT');
}
out.textContent=L.join('\n');
</script></body></html>
